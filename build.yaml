name: "JellyTV"
guid: "f8a3c1d7-9b2e-4a5f-8c6d-3e1b7f4a2d9c"
description: >
  Jellyfin Live TV plugin that exposes individual IPTV channels (Directo, FAST
  and Tokenizado) with automatic token renewal, no transcoding and no M3U tuner.

overview: >
  "JellyTV entrega tus canales IPTV como proveedor nativo de Live TV. Los canales
  Directo/FAST se sirven por relay reescribiendo el HLS; los Tokenizados resuelven
  la cadena/gateway (redirects o HTML con token embebido) y mantienen el token
  fresco — por sesión o efímero — con renovación reactiva (401/403)."

