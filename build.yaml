  - version: "1.1.0.0"
    changelog: "Catálogo de proveedores FAST: importa canales de Pluto TV, Plex, Tubi y Runtime directo de su API, con logo, categoría (Movies, Series, Kids, News, Sports, Music, General) y guía; si ya tienes el canal, se añade como fuente de respaldo en vez de duplicarse; salida por proxy de otro país para los catálogos con geobloqueo. Salud de canales: los canales del catálogo se comprueban resolviendo su URL, los apagados también se revisan y un canal apagado que está vivo se enciende solo; un canal sin resultado ya no se marca como muerto. Guías locales como candidatos de identidad y resumen con barras de progreso. Panel en español e inglés según el idioma del usuario. Correcciones: ventana DVR desmesurada y continuidad del relay FAST. Requiere Jellyfin 12.1 o superior."
