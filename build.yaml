description: >
  IPTV proxy plugin with automatic token renewal, HLS broadcast engine,
  and configurable M3U source management.

overview: >
  JellyTV aggregates multiple M3U/IPTV sources, rewrites stream URLs through
  an internal proxy, and maintains HLS playback sessions with rotating token
  refresh — providing stable Live TV across providers that use short-lived tokens.

